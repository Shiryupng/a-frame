
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reto AR</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

  <script>
    AFRAME.registerComponent('colocar-personaje', {
      init: function () {
        const personaje = this.el;
        const escena = this.el.sceneEl;

        escena.addEventListener('enter-vr', () => {
          if (escena.is('ar-mode')) {
            const camara = escena.camera;
            if (!camara) return;

            const direccion = new THREE.Vector3();
            camara.getWorldDirection(direccion);

            const posicionCamara = new THREE.Vector3();
            camara.getWorldPosition(posicionCamara);

            personaje.object3D.position.copy(posicionCamara);
            personaje.object3D.position.add(
              direccion.multiplyScalar(3)
            );

            // Coloca los pies aproximadamente a la altura del suelo.
            personaje.object3D.position.y = 0;
          }
        });
      }
    });
  </script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    xr-mode-ui="enabled: true"
    webxr="optionalFeatures: hit-test;">

    <a-assets timeout="30000">
      <a-asset-item
        id="yo"
        src="./DancingTwerk.glb">
      </a-asset-item>
    </a-assets>

    <a-entity
      light="type: ambient; intensity: 1">
    </a-entity>

    <a-entity
      light="type: directional; intensity: 0.8"
      position="1 3 2">
    </a-entity>

    <a-plane
      rotation="-90 0 0"
      width="10"
      height="10"
      color="#999">
    </a-plane>

    <a-entity
      id="personaje"
      gltf-model="#yo"
      position="0 0 -3"
      rotation="0 0 0"
      scale="1 1 1"
      animation-mixer="clip: *; loop: repeat"
      colocar-personaje>
    </a-entity>

    <a-entity
      camera
      look-controls
      position="0 1.6 0">
    </a-entity>

  </a-scene>

</body>
</html>
