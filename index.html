
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reto AR</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    xr-mode-ui="XRMode: ar;"
    webxr="referenceSpaceType: local-floor;
           requiredFeatures: local-floor;
           optionalFeatures: hit-test;">

    <!-- Modelo y animaciones -->
    <a-assets timeout="30000">
      <a-asset-item
        id="yo"
        src="./DancingTwerk.glb">
      </a-asset-item>
    </a-assets>

    <!-- Iluminación -->
    <a-entity
      light="type: ambient; intensity: 1">
    </a-entity>

    <a-entity
      light="type: directional; intensity: 0.8"
      position="1 3 2">
    </a-entity>

    <!-- Suelo para la vista virtual del PC -->
    <a-plane
      rotation="-90 0 0"
      width="10"
      height="10"
      color="#999">
    </a-plane>

    <!-- Personaje a 3 metros del origen, hacia delante -->
    <a-entity
      id="personaje"
      gltf-model="#yo"
      position="0 0 -3"
      rotation="0 0 0"
      scale="1 1 1"
      animation-mixer="clip: *; loop: repeat">
    </a-entity>

    <!-- Cámara -->
    <a-entity
      camera
      look-controls>
    </a-entity>

  </a-scene>

</body>
</html>
